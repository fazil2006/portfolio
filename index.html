﻿<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fazil A R | Aspiring Full-Stack Developer</title>
  <meta name="description" content="Portfolio of Fazil A R - Computer Science Engineering Student and Full-Stack Developer specializing in modern web applications, scalable systems, and clean UI design." />
  <meta name="author" content="Fazil A R" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d4ed8'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='42'>FR</text></svg>" />
  
  <!-- Modern Typography: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- React 18, ReactDOM & Babel for Instant Seamless In-Browser Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ==========================================================================
       CSS VARIABLES & DESIGN TOKENS (Dark Blue Theme)
       ========================================================================== */
    :root {
      /* Dark Canvas Palette */
      --bg-canvas: #0c1017;
      --bg-surface: #111827;
      --bg-surface-elevated: #1e293b;
      --bg-subtle: #162032;
      --bg-pill: #1a273e;
      
      --text-main: #ffffff;
      --text-muted: #e2e8f0;
      --text-faint: #94a3b8;
      
      --border-light: #1e293b;
      --border-hover: #334155;
      
      /* Dark Blue Primary & Glowing Accents */
      --accent: #1d4ed8;
      --accent-hover: #2563eb;
      --accent-light: rgba(29, 78, 216, 0.16);
      --accent-border: rgba(29, 78, 216, 0.5);
      --accent-glow: 0 0 25px rgba(29, 78, 216, 0.5);
      
      --emerald-accent: #22c55e;
      --emerald-light: rgba(34, 197, 94, 0.12);
      --emerald-border: rgba(34, 197, 94, 0.35);
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      
      --shadow-xs: 0 2px 4px rgba(0, 0, 0, 0.5);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.6);
      --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.7);
      --shadow-lg: 0 20px 35px -5px rgba(0, 0, 0, 0.85);
      --shadow-glow: 0 0 40px rgba(29, 78, 216, 0.38);
      
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle deep blue space grid / vignette */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: radial-gradient(rgba(29, 78, 216, 0.15) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: -1;
      opacity: 0.7;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      transition: var(--transition);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .section {
      padding: 96px 0;
      position: relative;
    }

    @media (max-width: 768px) {
      .section {
        padding: 64px 0;
      }
    }

    .section-header {
      margin-bottom: 48px;
    }

    .section-header.text-center {
      text-align: center;
    }

    .section-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #60a5fa;
      background-color: var(--accent-light);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      margin-bottom: 14px;
      border: 1px solid var(--accent-border);
    }

    .section-title {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-main);
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .section-desc {
      font-size: 1.0625rem;
      color: var(--text-muted);
      max-width: 650px;
      line-height: 1.6;
    }

    .section-header.text-center .section-desc {
      margin: 0 auto;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      transition: var(--transition);
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff !important;
      box-shadow: 0 4px 16px rgba(29, 78, 216, 0.45);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(29, 78, 216, 0.65);
    }

    .btn-secondary {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-xs);
    }

    .btn-secondary:hover {
      background: #273549;
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: rgba(12, 16, 23, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-light);
      transition: var(--transition);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.01em;
    }

    .logo-initials {
      width: 36px;
      height: 36px;
      background: var(--accent);
      color: #ffffff;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 900;
      font-family: var(--font-mono);
      box-shadow: 0 2px 12px rgba(29, 78, 216, 0.55);
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-link {
      font-size: 0.925rem;
      font-weight: 500;
      color: var(--text-muted);
      position: relative;
      padding: 6px 0;
      transition: var(--transition);
    }

    .nav-link:hover, .nav-link.active {
      color: #ffffff;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #3b82f6;
      box-shadow: 0 0 10px #3b82f6;
    }

    .nav-cta {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #ffffff !important;
      padding: 8px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(29, 78, 216, 0.4);
      transition: var(--transition);
    }

    .nav-cta:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(29, 78, 216, 0.6);
    }

    .mobile-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
      background: transparent;
      border: none;
    }

    .mobile-toggle span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--text-main);
      border-radius: 2px;
      transition: var(--transition);
    }

    @media (max-width: 860px) {
      .mobile-toggle {
        display: flex;
      }

      .nav-links {
        position: fixed;
        top: 72px;
        left: 0;
        width: 100%;
        background: #0c1017;
        border-bottom: 1px solid var(--border-light);
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 16px 24px 24px;
        box-shadow: var(--shadow-lg);
        transform: translateY(-120%);
        opacity: 0;
        pointer-events: none;
        transition: var(--transition);
      }

      .nav-links.open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .nav-link {
        display: block;
        padding: 14px 0;
        border-bottom: 1px solid var(--border-light);
      }

      .nav-cta {
        display: block;
        text-align: center;
        margin-top: 14px;
      }
    }

    /* Hero */
    .hero-section {
      padding-top: 140px;
      padding-bottom: 80px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 48px;
      align-items: center;
    }

    @media (max-width: 960px) {
      .hero-grid {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 40px;
      }
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    @media (max-width: 960px) {
      .hero-content {
        align-items: center;
      }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      position: relative;
    }

    .status-dot::after {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
      opacity: 0.4;
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes ping {
      75%, 100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    .hero-name {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: -0.035em;
      color: var(--text-main);
      line-height: 1.1;
      margin-bottom: 12px;
    }

    @media (max-width: 640px) {
      .hero-name {
        font-size: 2.75rem;
      }
    }

    .hero-role {
      font-size: 1.35rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    .hero-bio {
      font-size: 1.08rem;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 580px;
      margin-bottom: 28px;
    }

    .contact-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 32px;
    }

    @media (max-width: 960px) {
      .contact-pills {
        justify-content: center;
      }
    }

    .pill-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      padding: 8px 14px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      box-shadow: var(--shadow-xs);
      transition: var(--transition);
    }

    .pill-item.clickable {
      cursor: pointer;
      user-select: none;
    }

    .pill-item.clickable:hover {
      background: var(--bg-surface-elevated);
      border-color: var(--accent);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .pill-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60a5fa;
    }

    .copy-chip {
      font-size: 0.725rem;
      font-family: var(--font-mono);
      background: #1e293b;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      color: #94a3b8;
      margin-left: 4px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
    }

    @media (max-width: 960px) {
      .hero-actions {
        justify-content: center;
      }
    }

    /* ==========================================================================
       CIRCULAR PHOTO (Dark Blue Glow & Border)
       ========================================================================== */
    .hero-photo-wrapper {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .hero-photo-card {
      position: relative;
      width: 290px;
      height: 290px;
      padding: 6px;
      background: linear-gradient(135deg, #1d4ed8 0%, #0f172a 45%, #2563eb 100%);
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(29, 78, 216, 0.45), 0 15px 35px rgba(0, 0, 0, 0.85);
      transition: var(--transition);
    }

    .hero-photo-card:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 0 45px rgba(29, 78, 216, 0.6), 0 18px 36px rgba(0, 0, 0, 0.9);
    }

    .hero-photo-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #0c1017;
      border: 4px solid #0c1017;
    }

    .hero-photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      transition: transform 0.5s ease;
    }

    .hero-photo-card:hover .hero-photo-img {
      transform: scale(1.015);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 48px;
      width: 100%;
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 20px 18px;
      text-align: center;
      box-shadow: var(--shadow-xs);
      transition: var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(29, 78, 216, 0.25);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: #60a5fa;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .stat-detail {
      font-size: 0.725rem;
      color: var(--text-faint);
    }

    /* Education */
    .edu-timeline {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .edu-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 28px;
      box-shadow: var(--shadow-xs);
      transition: var(--transition);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 24px;
      align-items: flex-start;
    }

    .edu-card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .edu-card.featured {
      border-color: var(--accent-border);
      background: linear-gradient(180deg, #131c2e 0%, #0f172a 100%);
      box-shadow: 0 4px 20px rgba(29, 78, 216, 0.15);
    }

    .edu-icon-box {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      background: var(--accent-light);
      color: #60a5fa;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--accent-border);
    }

    .edu-content-inner {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .edu-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .edu-degree {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .edu-period {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: #93c5fd;
      background: var(--accent-light);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--accent-border);
    }

    .edu-institution {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .edu-location {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.825rem;
      color: var(--text-faint);
    }

    .edu-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .edu-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .edu-highlight-pill {
      font-size: 0.775rem;
      font-weight: 600;
      background: var(--bg-surface-elevated);
      color: #60a5fa;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-light);
    }

    /* Projects */
    .projects-filter-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
    }

    .filter-btn {
      padding: 8px 18px;
      font-size: 0.875rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: #ffffff;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(29, 78, 216, 0.45);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
    }

    .project-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 32px;
      box-shadow: var(--shadow-xs);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .project-card:hover {
      border-color: var(--accent-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(29, 78, 216, 0.2);
      transform: translateY(-3px);
    }

    .project-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .project-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: #60a5fa;
      background: var(--accent-light);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--accent-border);
    }

    .project-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .project-icon-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .project-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 10px;
      letter-spacing: -0.015em;
    }

    .project-summary {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .project-features {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .project-features li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.8875rem;
      color: var(--text-muted);

    // --- ROOT APP ---
    function App() {
      const [toast, setToast] = useState({ show: false, message: '' });

      const showToast = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: '' }), 3200);
      };

      const copyToClipboard = (text, label) => {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text)
            .then(() => showToast(`${label} copied to clipboard!`))
            .catch(() => fallbackCopy(text, label));
        } else {
          fallbackCopy(text, label);
        }
      };

      const fallbackCopy = (text, label) => {
        try {
          const tempInput = document.createElement('input');
          tempInput.value = text;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand('copy');
          document.body.removeChild(tempInput);
          showToast(`${label} copied to clipboard!`);
        } catch {
          showToast(`Failed to copy ${label}`);
        }
      };

      return (
        <div className="portfolio-app">
          <Navbar />
          <main>
            <Hero onCopy={copyToClipboard} />
            <Education />
            <Projects />
            <Skills />
            <Achievements />
            <Contact onCopy={copyToClipboard} showToast={showToast} />
          </main>
          <Footer />
          <Toast toast={toast} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
